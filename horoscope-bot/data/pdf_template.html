<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  @page {
    size: A4;
    margin: 2cm 2.5cm;
    @bottom-center {
      content: "Votive VedicVN — Trang " counter(page) " / " counter(pages);
      font-size: 9pt;
      color: #888;
      font-family: 'DejaVu Sans', sans-serif;
    }
  }
  body { font-family: 'DejaVu Sans', sans-serif; font-size: 11pt; line-height: 1.7; color: #222; }
  .header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #d4a017; }
  .header h1 { font-size: 20pt; color: #1a1a2e; margin: 0 0 5px; letter-spacing: 1px; }
  .header .subtitle { font-size: 10pt; color: #d4a017; text-transform: uppercase; letter-spacing: 3px; }
  .meta { margin: 20px 0 30px; padding: 15px 20px; background: #f7f3eb; border-left: 4px solid #d4a017; font-size: 10pt; }
  .meta table { width: 100%; border-collapse: collapse; }
  .meta td { padding: 3px 10px; }
  .meta td:first-child { font-weight: bold; width: 140px; color: #555; }
  .body-text { text-align: justify; }
  h2 { font-size: 14pt; color: #1a1a2e; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-top: 30px; margin-bottom: 15px; }
  h3 { font-size: 12pt; color: #d4a017; margin-top: 20px; margin-bottom: 10px; }
  .footer-note { margin-top: 40px; padding-top: 15px; border-top: 1px solid #ddd; font-size: 9pt; color: #888; text-align: center; }
  p { margin: 8px 0; }
  strong { color: #1a1a2e; }
  ul { margin: 5px 0 5px 20px; padding: 0; }
  li { margin: 3px 0; }
</style>
</head>
<body>
<div class="header">
  <h1>LÁ SỐ CHIÊM TINH VỆ ĐÀ</h1>
  <div class="subtitle">Luận Giải Chi Tiết</div>
</div>
<div class="meta">
  <table>
    <tr><td>Họ tên:</td><td>%%NAME%%</td></tr>
    <tr><td>Ngày sinh:</td><td>%%DOB%%</td></tr>
    <tr><td>Giờ sinh:</td><td>%%TOB%%</td></tr>
    <tr><td>Nơi sinh:</td><td>%%POB%%</td></tr>
  </table>
</div>
<div class="body-text">%%BODY%%</div>
<div class="footer-note">Votive VedicVN — Ngày xuất: %%DATE%% — %%CHARS%% ký tự</div>
</body></html>
